$kind: http-request
url: "{{baseUrl}}/payout-options"
method: GET
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
        const data = pm.response.json();
        if (Array.isArray(data.options) && data.options.length) {
          pm.collectionVariables.set('payoutOptionId', data.options[0].method_id || data.options[0].id || '');
        }
      }
    language: text/javascript
order: 1000
